kube-prometheus-stack:
  crds:
    enabled: true
  defaultRules:
    create: false
  global:
    rbac:
      create: true
    imageRegistry: ""
  alertmanager:
    enabled: false
  grafana:
    enabled: true
  kubernetesServiceMonitors:
    enabled: false
  kubeApiServer:
    enabled: false
  kubelet:
    enabled: false
  kubeControllerManager:
    enabled: false
  coreDns:
    enabled: false
  kubeDns:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeProxy:
    enabled: false
  kubeStateMetrics:
    enabled: false
  nodeExporter:
    enabled: true
  prometheusOperator:
    enabled: true
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
    nodeSelector:
      "node-role.kubernetes.io/control-plane": ""
  prometheus:
    prometheusSpec:
      initContainers:
        - name: fix-permissions
          image: busybox
          # O comando limpa arquivos de trava antigos e ajusta o dono da pasta
          command:
            [
              "sh",
              "-c",
              "rm -f /prometheus/queries.active && chown -R 1000:2000 /prometheus && chmod -R 775 /prometheus",
            ]
          securityContext:
            runAsUser: 0 # Precisa ser root para dar chown
          volumeMounts:
            - name: prometheus-prometheus-kube-prometheus-prometheus-db
              mountPath: /prometheus
      replicas: 1
      securityContext:
        fsGroup: 2000
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 1000
        containerSecurityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true # O Prometheus escreve apenas no /prometheus (volume)
      storageSpec:
        # disableMountSubPath: true
        volumeClaimTemplate:
          spec:
            disableMountSubPath: true
            volumeName: "prometheus-pv"
            storageClassName: "local-storage"
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 8Gi
      retention: 7d
      ruleSelectorNilUsesHelmValues: false
      serviceMonitorSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: Exists
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
    ingress:
      enabled: false
