home-assistant:
  image:
    tag: 2026.6.1
  replicaCount: 1
  service:
    port: 8123
  controller:
    type: StatefulSet
  persistence:
    enabled: true
    storageClass: "local-storage"
    accessMode: ReadWriteOnce
    size: 2Gi
  additionalPorts:
    - name: dlna
      containerPort: 5555
      protocol: TCP
  additionalServices:
    - name: dlna
      port: 5555
      targetPort: dlna
      type: ClusterIP
      protocol: TCP
  serviceMonitor:
    enabled: true
    namespace: prometheus
    scrapeInterval: 30s
    labels:
      release: prometheus
    bearerToken:
      secretName: "home-assistant-token"
      secretKey: "token"
  configuration:
    enabled: true
    forceInit: true
    trusted_proxies:
      - 10.0.0.0/8
      - 127.0.0.0/8
      - 10.100.0.0/16
      - 10.10.0.0/16
      - 10.244.0.0/24
      - 10.244.1.0/24
      - 10.244.2.0/24
      - 10.244.3.0/24
    templateConfig: |-
      # Loads default set of integrations. Do not remove.
      default_config:

      {{- if .Values.ingress.enabled }}
      http:
        use_x_forwarded_for: true
        trusted_proxies:
          {{- range .Values.configuration.trusted_proxies }}
          - {{ . }}
          {{- end }}
      {{- end}}
      # Load frontend themes from the themes folder
      frontend:
        themes: !include_dir_merge_named themes

      automation: !include automations.yaml
      script: !include scripts.yaml
      scene: !include scenes.yaml
      sensor:
        - platform: rest
          name: solar_energy_input
          scan_interval: 86400
          resource: http://solarz-wrapper/api/v1/data
          value_template: "{{ value_json[0].value }}"
          unit_of_measurement: "kWh"
  ingress:
    enabled: true
    ingressClass: traefik-traefik
    annotations:
      kubernetes.io/ingress.class: traefik
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: "cloudflare"
    hosts:
      - host: ha.cavaleiro.in
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: ha.cavaleiro.in
        hosts:
          - ha.cavaleiro.in
