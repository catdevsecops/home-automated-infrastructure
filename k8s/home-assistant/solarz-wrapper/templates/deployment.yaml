---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: solarz-wrapper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solarz-wrapper
  template:
    metadata:
      labels:
        app: solarz-wrapper
    spec:
      containers:
      - name: solarz-wrapper
        image: ghcr.io/catdevsecops/solarz-homeassistant-api-wrapper:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: SOLARZ_ENDPOINT
          value: "https://app.solarz.com.br/shareable/generation/period?usinaUuid=526b9bc6-66c1-4c4b-8539-893a56c4c873&period=week&uniteMonths=false"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5

