---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: unify-ingress-default
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`unifi.cavaleiro.in`)
    kind: Rule
    middlewares:
      - name: redirect-https # Aplica o redirecionamento aqui
    services:
    - name: unifi-external-svc
      port: 443 # O Traefik usará o DNS para resolver o ExternalName
      scheme: https
      serversTransport: skip-verify # Referência ao objeto acima
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: unify-ingress-default-ssl
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`unifi.cavaleiro.in`)
    kind: Rule
    services:
    - name:  unifi-external-svc
      port: 443 # O Traefik usará o DNS para resolver o ExternalName
      scheme: https
      serversTransport: skip-verify # Referência ao objeto acima
  tls:
    certResolver: cloudflare
